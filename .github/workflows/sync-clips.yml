# ============================================================================
# AUTOMATIC CLIP SYNC WORKFLOW — Clippng.in
# ============================================================================
# NOTE ON HOW THIS WORKS:
# Because Clippng.in is a static site (no backend server), visitor browsers cannot
# fetch YouTube/TikTok/X/Instagram feeds directly (due to CORS and login walls).
#
# Instead, this GitHub Action runs `npm run sync` once every day on a schedule
# (and whenever you trigger it manually in the GitHub "Actions" tab).
# If `src/config/clips.generated.json` has changed, it commits the updated file
# back to the repository, which automatically triggers a fresh deploy on
# Netlify or Vercel. This is the closest thing to "live" updates for a static site
# without real-time browser scraping.

name: Sync Clips Data

on:
  schedule:
    # Runs daily at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual one-click run from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Clip Sync
        env:
          # Optional secrets — the script works cleanly even if none of these are set in GitHub Secrets
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          INSTAGRAM_OEMBED_TOKEN: ${{ secrets.INSTAGRAM_OEMBED_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: npm run sync

      - name: Commit and push if clips.generated.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config/clips.generated.json src/config/sources.js
          if git diff --staged --quiet; then
            echo "No clip changes detected."
          else
            git commit -m "chore(clips): automated sync of clips.generated.json"
            git push
          fi
